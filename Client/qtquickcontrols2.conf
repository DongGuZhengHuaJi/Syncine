; Pin a non-native Qt Quick Controls style for the packaged application.
; Windows defaults to the native "Windows" style, which does not support
; customizing background/contentItem; the Syncine UI relies on those overrides.
; On Linux the default is already non-native, which is why this only shows up
; in the Windows build. Installed to <prefix>/bin/ by Client/CMakeLists.txt.
[Controls]
Style=Basic
