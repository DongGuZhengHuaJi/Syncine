name: release

# 只在推 v1.0.0 这类标签时触发 —— 打 tag = 宣布要发版。
on:
  push:
    tags: ['v*']
    # server-ci 分支用于验证服务端双端构建；客户端 job 也会一起跑，
    # 顺便保证打包流程没有回归（tag 才会附加到 Release）。
    branches: ['feat/server-ci']
  # 手动触发，方便在不打 tag 的情况下试跑打包流程
  workflow_dispatch:

# 附加到 Release 需要写仓库内容的权限。默认令牌通常是只读的，
# 不显式声明会在 softprops/action-gh-release 报
# "Resource not accessible by integration"。
permissions:
  contents: write

jobs:
  linux:
    name: Linux 包
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          # libwebrtc.a 的链接需要 X11/GL 系列开发包；GitHub 的
          # ubuntu-24.04 镜像不保证这些都在，显式装上
          sudo apt-get install -y \
            ninja-build clang lld \
            zlib1g-dev \
            libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxext-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxtst-dev

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          # QuickControls2 / Quick.Dialogs 在 6.10.2 已并入基础 qtdeclarative，
          # aqt 里没有同名独立包（写了会直接报 packages not found）
          modules: 'qtmultimedia qtwebsockets'

      - name: 下载随包工具
        run: ./scripts/fetch-tools.sh

      # WebRTC 在 CI 里现编要几小时，所以从 Release 附件下载预编译产物。
      # 产物由维护者在本地用 scripts/build-webrtc.sh 生成后上传，见
      # third_party/webrtc/README.md 第 5 节。
      - name: 下载预编译 WebRTC
        env:
          WEBRTC_ASSET_URL: ${{ vars.WEBRTC_LINUX_ASSET_URL }}
        run: |
          if [ -z "${WEBRTC_ASSET_URL}" ]; then
            echo "::error::未配置仓库变量 WEBRTC_LINUX_ASSET_URL。" \
                 "请在 Settings → Actions → Variables 里填上预编译 WebRTC 产物的下载地址。"
            exit 1
          fi
          mkdir -p webrtc
          curl -fL --retry 3 -o webrtc.tar.zst "${WEBRTC_ASSET_URL}"
          # 产物顶层是 webrtc-linux-<arch>-<rev>/，剥掉这一层，
          # 使 webrtc/ 本身可以直接作为 WEBRTC_ROOT（含 api/ 与 out/）
          tar --zstd -xf webrtc.tar.zst -C webrtc --strip-components=1

      - name: 配置
        run: |
          cmake -S Client -B Client/build-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DWEBRTC_ROOT="$PWD/webrtc"

      - name: 构建
        run: cmake --build Client/build-release --parallel

      - name: 打包
        working-directory: Client/build-release
        run: cpack

      - name: 生成校验和
        working-directory: Client/build-release
        run: sha256sum Syncine-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Syncine-Linux
          path: |
            Client/build-release/Syncine-*.tar.gz
            Client/build-release/Syncine-*.zip
            Client/build-release/SHA256SUMS.txt

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Client/build-release/Syncine-*.tar.gz
            Client/build-release/Syncine-*.zip
            Client/build-release/SHA256SUMS.txt

  # ====================================================================
  # Windows 包。
  #
  # Windows 版 libwebrtc 必须在 Windows/MSVC 上构建，无法从 Linux 交叉编译；
  # 预编译产物放在独立的 WebRTC Release 里，地址由仓库变量
  # WEBRTC_WINDOWS_ASSET_URL 提供（见 third_party/webrtc/README.md 第 5 节）。
  #
  # needs: linux —— 让 Linux job 先把 Release 建出来，避免两个 job 同时
  # 创建 Release/上传同名资产时互相打架。
  # ====================================================================
  windows:
    name: Windows 包
    needs: linux
    # 预编译 webrtc.lib 是 Chromium clang-cl 24 + VS 2026 (MSVC 14.51) STL
    # 编出来的；用 VS 2022 链接会缺 __std_* 符号。这里固定到 VS 2026 镜像，
    # 生成器也必须是 Visual Studio 18 2026。Qt 的 msvc2022_64 与其 ABI 兼容
    # （BUILD-INFO.md 已验证过）。
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          # Windows 必须用与 webrtc.lib 相同的 MSVC ABI（Qt 官方 win64_msvc2022_64）
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtwebsockets'
          cache: true

      - name: 下载随包工具（Windows 版）
        shell: bash
        # ffmpeg / yt-dlp 的 Windows 哈希本仓库没有验证过，脚本只会警告；
        # 下载失败也不该挡住出包（Client/CMakeLists.txt 用 EXISTS 包住了 tools/）
        continue-on-error: true
        run: ./scripts/fetch-tools.sh

      - name: 下载预编译 WebRTC
        shell: pwsh
        env:
          WEBRTC_ASSET_URL: ${{ vars.WEBRTC_WINDOWS_ASSET_URL }}
        run: |
          if (-not $env:WEBRTC_ASSET_URL) {
            Write-Error "未配置仓库变量 WEBRTC_WINDOWS_ASSET_URL"
            exit 1
          }
          New-Item -ItemType Directory -Force webrtc | Out-Null
          curl.exe -fL --retry 3 -o webrtc.zip "$env:WEBRTC_ASSET_URL"
          7z x webrtc.zip -owebrtc

          # 压缩包顶层可能是 webrtc-windows-x64-<rev>/，也可能是平铺的。
          # 以 out/Default/obj/webrtc.lib 所在目录为准，避免把 WEBRTC_ROOT
          # 指到外层或某个头文件子目录。
          $root = $null
          if (Test-Path "webrtc\out\Default\obj\webrtc.lib") {
            $root = (Resolve-Path webrtc).Path
          } else {
            $candidate = Get-ChildItem webrtc -Directory | Where-Object {
              Test-Path (Join-Path $_.FullName "out\Default\obj\webrtc.lib")
            } | Select-Object -First 1
            if ($candidate) { $root = $candidate.FullName }
          }
          if (-not $root) {
            Write-Error "webrtc.zip 里找不到 out/Default/obj/webrtc.lib"
            exit 1
          }
          "WEBRTC_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "WEBRTC_ROOT=$root"

      # 客户端从 1.2.1 起依赖 zlib（直播弹幕的压缩包体）。Windows runner
      # 没有系统 zlib：用自带的 vcpkg 装一份静态库。选 static-md 是因为
      # Qt / WebRTC 都用动态 CRT（/MD），static 的 /MT 会链接冲突。
      - name: 安装 zlib
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 配置（MSVC + VS 生成器）
        shell: pwsh
        run: |
          # 不走 vcpkg 的 CMake 工具链，只把 zlib 的头文件和库路径交给
          # FindZLIB —— 避免 vcpkg 介入 Qt / WebRTC 的 find_package。
          # 静态库在 Windows 上叫 libzs.lib（不是 zlib.lib），直接找而不是猜名字。
          $zlibRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          $zlibLib = Get-ChildItem "$zlibRoot\lib\*.lib" | Select-Object -First 1
          if (-not $zlibLib) { throw "vcpkg zlib 静态库不存在: $zlibRoot\lib" }
          cmake -S Client -B Client/build-release -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DZLIB_INCLUDE_DIR="$zlibRoot\include" `
            -DZLIB_LIBRARY="$($zlibLib.FullName)" `
            -DWEBRTC_ROOT="$env:WEBRTC_ROOT" `
            -DWEBRTC_WIN_SYSTEM_LIBS="$env:WEBRTC_WIN_SYSTEM_LIBS"

      - name: 构建
        run: cmake --build Client/build-release --config Release --parallel

      - name: 打包
        working-directory: Client/build-release
        run: cpack -C Release

      - name: 生成校验和
        shell: pwsh
        working-directory: Client/build-release
        run: |
          # 文件名带 Windows 后缀，避免和 Linux job 的 SHA256SUMS.txt
          # 在 Release 里同名冲突
          Get-ChildItem Syncine-*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS-Windows.txt
          Get-Content SHA256SUMS-Windows.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Syncine-Windows
          path: |
            Client/build-release/Syncine-*.zip
            Client/build-release/SHA256SUMS-Windows.txt

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Client/build-release/Syncine-*.zip
            Client/build-release/SHA256SUMS-Windows.txt

  # ====================================================================
  # 服务端包。
  #
  # 服务端只依赖 Boost（asio / beast / uuid，均为 header-only）和 OpenSSL，
  # 不依赖 Qt，所以单独一个轻量 job，不跟 Linux 客户端共用。
  #
  # Server/CMakeLists.txt 目前没有 CPack 配置，这里走 cmake --install
  # 装到暂存目录后自行打 tar.gz —— 只为出包改构建脚本没必要，也让这个 PR
  # 的改动范围保持在 release.yml 一个文件内。
  #
  # needs: linux —— 同 windows，让 Linux job 先把 Release 建出来，
  # 避免多个 job 同时创建 Release / 上传资产时互相打架。
  # ====================================================================
  server:
    name: 服务端包
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          # C++23 需要 GCC 13+，ubuntu-24.04 自带 GCC 14，无需额外装编译器
          sudo apt-get install -y ninja-build libboost-dev libssl-dev nlohmann-json3-dev

      - name: 确定版本号
        id: version
        # 打 tag 发版时用 tag 里的版本，让 Release 中的资产与客户端一致；
        # 手动触发（workflow_dispatch）时回落到 Server/CMakeLists.txt 的
        # project VERSION，避免产出一个版本号不明的包。
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # 取不到就退化成 0.0.0，避免空版本号产出畸形文件名
            V=$(sed -n 's/^project(Server VERSION \([0-9.]*\).*/\1/p' Server/CMakeLists.txt)
            echo "value=${V:-0.0.0}" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置
        run: |
          cmake -S Server -B Server/build-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build Server/build-release --parallel

      - name: 健壮性测试
        run: ctest --test-dir Server/build-release --output-on-failure

      - name: 冒烟测试
        # 必须真正跑起来：只编译通过不能说明端口能绑、TURN 线程能收尾。
        # 无密钥时 TURN 线程会打一行 WARN 后退出，不影响监听。
        run: |
          SYNCINE_LOG_DIR="$RUNNER_TEMP/server-logs" ./Server/build-release/Server &
          pid=$!
          ready=0
          for _ in $(seq 1 20); do
            if ss -ltn | grep -q ':8765 '; then ready=1; break; fi
            sleep 0.5
          done
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::服务端启动后退出"
            cat "$RUNNER_TEMP"/server-logs/* 2>/dev/null || true
            exit 1
          fi
          if [ "$ready" -ne 1 ]; then
            echo "::error::服务端未监听 8765 端口"
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          kill "$pid"

      - name: 打包
        run: |
          PKG="Syncine-Server-${{ steps.version.outputs.value }}-Linux-x86_64"
          # install 规则会把可执行文件放到 <prefix>/bin/Server
          cmake --install Server/build-release --prefix "$PKG"
          cp LICENSE "$PKG/"
          tar -czf "${PKG}.tar.gz" "${PKG}"
          mkdir -p dist && mv "${PKG}.tar.gz" dist/
          # 文件名带 Server 后缀，避免和 Linux/Windows job 的
          # SHA256SUMS.txt 在 Release 里同名冲突
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS-Server.txt && cat SHA256SUMS-Server.txt )

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Syncine-Server
          path: |
            dist/Syncine-Server-*.tar.gz
            dist/SHA256SUMS-Server.txt

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Syncine-Server-*.tar.gz
            dist/SHA256SUMS-Server.txt

  # ====================================================================
  # Windows 服务端包。
  #
  # 与 Linux 版同一份源码，依赖换成 vcpkg 提供（GitHub 托管的 Windows
  # runner 自带 vcpkg，但没有 Boost/OpenSSL 头文件）。
  #
  # 用 x64-windows-static：服务端是单文件部署，动态 triplet 会要求把
  # boost_*.dll / libssl 等一起打包，漏拷一个就起不来。静态链接后
  # 只有一个 Server.exe，放进 Windows 服务或计划任务都省事。
  # 静态 triplet 的 CRT 也是 /MT，所以必须把 CMAKE_MSVC_RUNTIME_LIBRARY
  # 对齐，否则会混用 /MD 运行库导致链接错误。
  # ====================================================================
  server-windows:
    name: Windows 服务端包
    needs: linux
    runs-on: windows-2022
    env:
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖（vcpkg）
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            boost-asio boost-beast boost-uuid boost-random `
            openssl nlohmann-json --triplet $env:VCPKG_TRIPLET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 确定版本号
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $m = Select-String -Path Server/CMakeLists.txt `
                 -Pattern 'project\(Server VERSION ([0-9.]+)'
            $v = if ($m) { $m.Matches[0].Groups[1].Value } else { '0.0.0' }
          }
          "value=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: 配置
        shell: pwsh
        run: |
          cmake -S Server -B Server/build-release -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: 构建
        run: cmake --build Server/build-release --config Release --parallel

      - name: 健壮性测试
        shell: pwsh
        run: ctest --test-dir Server/build-release -C Release --output-on-failure

      - name: 冒烟测试
        shell: pwsh
        run: |
          $env:SYNCINE_LOG_DIR = Join-Path $env:RUNNER_TEMP 'server-logs'
          $process = Start-Process -FilePath 'Server\build-release\Release\Server.exe' `
            -PassThru -NoNewWindow
          $listening = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            if ($process.HasExited) { break }
            if (Get-NetTCPConnection -State Listen -LocalPort 8765 `
                -ErrorAction SilentlyContinue) {
              $listening = $true
              break
            }
          }
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          if (-not $listening) {
            Get-ChildItem $env:SYNCINE_LOG_DIR -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName }
            throw "服务端未监听 8765 端口（是否已退出: $($process.HasExited)）"
          }

      - name: 打包
        shell: pwsh
        run: |
          $pkg = "Syncine-Server-${{ steps.version.outputs.value }}-Windows-x64"
          # install 规则会把可执行文件放到 <prefix>/bin/Server.exe
          cmake --install Server/build-release --prefix $pkg --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE "$pkg\LICENSE"
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item "$pkg.zip" dist\
          $hash = (Get-FileHash "dist\$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          # 与 Linux 的 SHA256SUMS-Server.txt 分开命名，避免 Release 里同名冲突
          "$hash  $pkg.zip" | Set-Content -Encoding ascii dist\SHA256SUMS-Server-Windows.txt
          Get-Content dist\SHA256SUMS-Server-Windows.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Syncine-Server-Windows
          path: |
            dist/Syncine-Server-*.zip
            dist/SHA256SUMS-Server-Windows.txt

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Syncine-Server-*.zip
            dist/SHA256SUMS-Server-Windows.txt
