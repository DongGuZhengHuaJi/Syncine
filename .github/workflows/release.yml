name: release

# 只在推 v1.0.0 这类标签时触发 —— 打 tag = 宣布要发版。
on:
  push:
    tags: ['v*']
  # 手动触发，方便在不打 tag 的情况下试跑打包流程
  workflow_dispatch:

jobs:
  linux:
    name: Linux 包
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtmultimedia qtwebsockets'

      - name: 下载随包工具
        run: ./scripts/fetch-tools.sh

      # WebRTC 在 CI 里现编要几小时，所以从 Release 附件下载预编译产物。
      # 产物由维护者在本地用 scripts/build-webrtc.sh 生成后上传，见
      # third_party/webrtc/README.md 第 5 节。
      - name: 下载预编译 WebRTC
        env:
          WEBRTC_ASSET_URL: ${{ vars.WEBRTC_LINUX_ASSET_URL }}
        run: |
          if [ -z "${WEBRTC_ASSET_URL}" ]; then
            echo "::error::未配置仓库变量 WEBRTC_LINUX_ASSET_URL。" \
                 "请在 Settings → Actions → Variables 里填上预编译 WebRTC 产物的下载地址。"
            exit 1
          fi
          mkdir -p webrtc
          curl -fL --retry 3 -o webrtc.tar.zst "${WEBRTC_ASSET_URL}"
          tar --zstd -xf webrtc.tar.zst -C webrtc

      - name: 配置
        run: |
          cmake -S Client -B Client/build-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DWEBRTC_ROOT="$PWD/webrtc"

      - name: 构建
        run: cmake --build Client/build-release --parallel

      - name: 打包
        working-directory: Client/build-release
        run: cpack

      - name: 生成校验和
        working-directory: Client/build-release
        run: sha256sum Syncine-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Syncine-Linux
          path: |
            Client/build-release/Syncine-*.tar.gz
            Client/build-release/Syncine-*.zip
            Client/build-release/SHA256SUMS.txt

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Client/build-release/Syncine-*.tar.gz
            Client/build-release/Syncine-*.zip
            Client/build-release/SHA256SUMS.txt

  # ====================================================================
  # Windows 包 —— 尚未启用，原因见下。
  #
  # 缺的不是这份 YAML，而是**Windows 版的 libwebrtc**：
  #   Chromium 的构建系统在 Windows 上强制要求 MSVC，无法从 Linux 交叉编译，
  #   必须在 Windows 机器上跑 scripts/build-webrtc.sh 的等价流程（数小时）。
  # 拿到 `libwebrtc.a`（Windows 下实为 webrtc.lib）与随附的 lld 之后：
  #   1. 把它打成 zip 作为 Release 附件，地址填进仓库变量 WEBRTC_WINDOWS_ASSET_URL；
  #   2. 照 cmake/FindWebRTC.cmake 里 Linux 那套，补上 Windows 的宏与系统库
  #      （WIN32 分支目前会直接 FATAL_ERROR，就是为了避免悄悄产出坏二进制）；
  #   3. 取消下面的注释。
